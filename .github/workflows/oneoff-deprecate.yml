name: One-off deprecate alpha.3

on:
  workflow_dispatch:

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Deprecate broken alpha.3
        run:
          npm deprecate @yyc3/ui@3.0.0-alpha.3 "出口错位（hooks/theme-manager/performance
          子路径不可用），请用 3.0.0-alpha.4+"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.YYC3_NPM_TOKEN }}
